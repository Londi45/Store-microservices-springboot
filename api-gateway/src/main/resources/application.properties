eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka
spring.application.name=api-gateway
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=localhost

logging.level.root=INFO
logging.level.org.springframework.cloud.gateway.route.RouteDefinitionLocator=INFO
logging.level.org.springframework.cloud.gateway=TRACE

spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedOrigins=*
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedHeaders=*

# Product service route
spring.cloud.gateway.routes[0].id=product-service
spring.cloud.gateway.routes[0].uri=lb://product-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/product

# Order service route
spring.cloud.gateway.routes[1].id=order-service
spring.cloud.gateway.routes[1].uri=lb://order-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/order

# Inventory service route
spring.cloud.gateway.routes[2].id=inventory-service
spring.cloud.gateway.routes[2].uri=lb://inventory-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/inventory/**

# Discovery Server route
spring.cloud.gateway.routes[3].id=discovery-server
spring.cloud.gateway.routes[3].uri=http://localhost:8761
spring.cloud.gateway.routes[3].predicates[0]=Path=/eureka/web
spring.cloud.gateway.routes[3].filters[0]=SetPath=/

# Discovery Server Static Resources Route
spring.cloud.gateway.routes[4].id=discovery-server-static
spring.cloud.gateway.routes[4].uri=http://localhost:8761
spring.cloud.gateway.routes[4].predicates[0]=Path=/eureka/**

# Swagger routes
spring.cloud.gateway.routes[5].id=product-service-swagger
spring.cloud.gateway.routes[5].uri=lb://product-service
spring.cloud.gateway.routes[5].predicates[0]=Path=/product-service/api-docs/**
spring.cloud.gateway.routes[5].filters[0]=RewritePath=/product-service/(?<segment>.*), /$\{segment}

spring.cloud.gateway.routes[6].id=order-service-swagger
spring.cloud.gateway.routes[6].uri=lb://order-service
spring.cloud.gateway.routes[6].predicates[0]=Path=/order-service/api-docs/**
spring.cloud.gateway.routes[6].filters[0]=RewritePath=/order-service/(?<segment>.*), /$\{segment}

spring.cloud.gateway.routes[7].id=inventory-service-swagger
spring.cloud.gateway.routes[7].uri=lb://inventory-service
spring.cloud.gateway.routes[7].predicates[0]=Path=/inventory-service/api-docs/**
spring.cloud.gateway.routes[7].filters[0]=RewritePath=/inventory-service/(?<segment>.*), /$\{segment}

# Springdoc - aggregate all service docs in gateway swagger UI
springdoc.swagger-ui.urls[0].name=product-service
springdoc.swagger-ui.urls[0].url=/product-service/api-docs
springdoc.swagger-ui.urls[1].name=order-service
springdoc.swagger-ui.urls[1].url=/order-service/api-docs
springdoc.swagger-ui.urls[2].name=inventory-service
springdoc.swagger-ui.urls[2].url=/inventory-service/api-docs